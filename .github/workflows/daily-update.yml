name: Daily apartment transaction update

on:
  push:
    branches: [main]
  schedule:
    # GitHub cron uses UTC. 22:00 UTC = next day's 07:00 Asia/Seoul.
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "refresh: collect and deploy; auto: verified same-day reuse; deploy-only: publish current main without API calls"
        type: choice
        options: [auto, refresh, deploy-only]
        default: refresh

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write

concurrency:
  group: apartment-data-pages-production
  cancel-in-progress: false

jobs:
  update:
    name: Validate data and deploy public to GitHub Pages
    runs-on: windows-latest
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.pages_deploy.outputs.page_url }}
    env:
      TZ: Asia/Seoul
      PIPELINE_MODE: ${{ inputs.mode || 'refresh' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out current main
        id: checkout
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Use supported Node.js runtime
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Prepare immutable baseline and stage log
        id: prepare
        run: node scripts/update-pipeline.cjs prepare

      - name: Collection, tracking, and Pages regression tests
        id: tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./scripts/test-openapi-updater.ps1
          ./scripts/test-molit-retries.ps1
          ./scripts/test-molit-transport.ps1
          ./scripts/test-deferred-catalog-matching.ps1
          ./scripts/test-deferred-catalog-matching.ps1 -FailDiscovery
          ./scripts/test-supply-area-builder.ps1
          ./scripts/test-first-seen-tracking.ps1
          node --test scripts/test-update-pipeline.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Pipeline regression tests failed.' }
          node scripts/test-pages-workflow.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Pages workflow regression tests failed.' }
          node scripts/test-apartment-catalog.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Catalog regression failed.' }
          node scripts/test-weekly-new-transactions.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Weekly-new regression failed.' }
          node scripts/test-first-seen-history-backfill.cjs
          if ($LASTEXITCODE -ne 0) { throw 'First-seen history regression failed.' }
          node scripts/test-supply-area-map.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Supply mapping regression failed.' }

      - name: "1. API collection (never modify the tracked dataset)"
        id: api
        env:
          MOLIT_API_KEY: ${{ secrets.MOLIT_API_KEY }}
        run: node scripts/update-pipeline.cjs api

      - name: "2a. Validate complete candidate and preserved tracking fields"
        id: validate
        if: ${{ success() }}
        run: node scripts/update-pipeline.cjs validation

      - name: "2b. Store in GitHub main and verify push"
        id: git
        if: ${{ success() }}
        run: node scripts/update-pipeline.cjs git

      # GITHUB_TOKEN pushes do not start another push workflow. Publish here.
      # This also runs for zero data changes, explicit deploy-only, and human pushes.
      # The pipeline selects refresh for catalog changes; other human pushes are deploy-only.
      - name: "3a. Validate committed public files and build metadata"
        id: pages_source
        if: ${{ success() }}
        run: node scripts/update-pipeline.cjs pages_source

      - name: Configure GitHub Pages
        id: pages_config
        if: ${{ success() }}
        uses: actions/configure-pages@v5

      - name: Upload only public to Pages
        id: pages_upload
        if: ${{ success() }}
        uses: actions/upload-pages-artifact@v4
        with:
          path: public/

      - name: Check main again before publishing
        id: pages_guard
        if: ${{ success() }}
        run: node scripts/update-pipeline.cjs pages_guard

      - name: "3b. Deploy GitHub Pages in this workflow"
        id: pages_deploy
        if: ${{ success() }}
        uses: actions/deploy-pages@v4

      - name: Record official Pages deployment result
        if: ${{ always() && steps.prepare.outcome == 'success' }}
        env:
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          PAGES_DEPLOY_OUTCOME: ${{ steps.pages_deploy.outcome }}
          PAGES_URL: ${{ steps.pages_deploy.outputs.page_url }}
          PAGES_BASE_URL: ${{ steps.pages_config.outputs.base_url }}
          PAGES_ARTIFACT_ID: ${{ steps.pages_upload.outputs.artifact_id }}
        run: node scripts/update-pipeline.cjs deployment

      - name: Final result (any failed stage makes the workflow fail)
        if: ${{ always() && steps.prepare.outcome == 'success' }}
        env:
          TEST_OUTCOME: ${{ steps.tests.outcome }}
        run: node scripts/update-pipeline.cjs final

      - name: Upload sanitized stage diagnostics (never API keys or raw data)
        if: ${{ always() && steps.prepare.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-diagnostics-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/apart-price-pipeline/report.json
            ${{ runner.temp }}/apart-price-pipeline/api-log.json
            ${{ runner.temp }}/apart-price-pipeline/expected-meta.json
          retention-days: 14
          if-no-files-found: warn
