[build]
  command = "node scripts/write-build-meta.cjs"
  publish = "public"

[[headers]]
  for = "/data/build-meta.json"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/data/transactions.js"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"
